# NOTE: the metrics control plane (/orchestrator/register, /orchestrator/ping)
# authenticates sidecars with a shared key read from the ORCHESTRATOR_KEY env
# var below, sourced from the `valkey-admin-orchestrator-key` Secret. Create that
# Secret with your OWN random value before applying this manifest — it is
# intentionally NOT defined here so `kubectl apply` can never overwrite a real
# key with a committed placeholder:
#
#   kubectl create secret generic valkey-admin-orchestrator-key -n valkey \
#     --from-literal=ORCHESTRATOR_KEY="$(openssl rand -hex 32)"
#
# The same Secret is referenced by every metrics sidecar
# (see valkey-statefulset-sidecar-patch.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey-admin-app
  namespace: valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app: valkey-admin-app
  template:
    metadata:
      labels:
        app: valkey-admin-app
    spec:
      containers:
        - name: app
          image: valkey-admin-app:test
          imagePullPolicy: Never
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "8080"
            - name: DEPLOYMENT_MODE
              value: "K8"
            - name: VALKEY_HOST
              value: valkey-0.valkey-headless.valkey.svc.cluster.local
            - name: VALKEY_PORT
              value: "6379"
            - name: ORCHESTRATOR_KEY
              valueFrom:
                secretKeyRef:
                  name: valkey-admin-orchestrator-key
                  key: ORCHESTRATOR_KEY
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: valkey-admin-app
  namespace: valkey
spec:
  selector:
    app: valkey-admin-app
  ports:
    - name: http
      port: 8080
      targetPort: http
