name: Feature Request
description: Suggest an idea or improvement
labels: ["enhancement"]
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What would you like?
      placeholder: Describe the feature or improvement you'd like to see.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Why?
      placeholder: What problem does this solve or what use case does it support?
    validations:
      required: false
