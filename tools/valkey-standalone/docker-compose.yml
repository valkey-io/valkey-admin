services:
    valkey-standalone:
        image: valkey-skyscope-json:local
        build: { context: ../valkey-cluster }
        platform: ${DOCKER_PLATFORM:-linux/arm64}
        container_name: valkey-standalone
        command:
            [
                "valkey-server",
                "--databases",
                "16",
                "--loadmodule",
                "/opt/modules/rejson.so",
                "--ignore-warnings",
                "ARM64-COW-BUG",
            ]
        ports: ["6379:6379"]
        healthcheck:
            {
                test: ["CMD", "valkey-cli", "-p", "6379", "PING"],
                interval: 2s,
                timeout: 1s,
                retries: 30,
            }
        networks: [valnet]

    populate:
        image: node:20
        depends_on:
            valkey-standalone: { condition: service_healthy }
        working_dir: /app/valkey-standalone
        volumes:
            - ./populate.mjs:/app/valkey-standalone/populate.mjs:ro
            - ../common/populate-helpers.mjs:/app/common/populate-helpers.mjs:ro
        environment:
            # inside Docker network; on host use valkey://localhost:6379 instead
            VALKEY_URL: "valkey://valkey-standalone:6379"
            POPULATE_DB_COUNT: ${POPULATE_DB_COUNT:-}
            POPULATE_BULK_KEYS: ${POPULATE_BULK_KEYS:-}
        networks: [valnet]
        command: >
            sh -c "
              npm -s install @valkey/client >/dev/null 2>&1 &&
              node populate.mjs
            "
        profiles: [populate]

networks:
    valnet:
