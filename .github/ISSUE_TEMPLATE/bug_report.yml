name: Bug Report
description: Report something that isn't working correctly
labels: ["bug"]
body:
  - type: checkboxes
    id: duplicate-check
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and didn't find a duplicate
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug and how to reproduce it.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: What did you expect to happen?
    validations:
      required: false
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Desktop (Electron)
        - Web (Docker)
        - Web (Kubernetes)
        - Other
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: e.g. 1.1.0
    validations:
      required: false
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      placeholder: If applicable, add screenshots to help explain the problem.
    validations:
      required: false
