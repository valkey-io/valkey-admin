x-valkey-env: &valkey-env
    ANNOUNCE_HOST: ${ANNOUNCE_HOST}
    CLUSTER_LFU_SLOT_STATS: ${CLUSTER_LFU_SLOT_STATS:-yes}

x-valkey-node: &valkey-node
    image: valkey-skyscope-json:local
    build: { context: . }
    platform: ${DOCKER_PLATFORM:-linux/arm64}
    command:
        - sh
        - -c
        - |
            set -- \
              --port "$$NODE_PORT" \
              --bind 0.0.0.0 \
              --cluster-enabled yes \
              --cluster-databases 16 \
              --cluster-config-file nodes.conf \
              --cluster-node-timeout 5000 \
              --cluster-announce-port "$$NODE_PORT" \
              --cluster-announce-bus-port "1$$NODE_PORT" \
              --cluster-announce-hostname "$$ANNOUNCE_HOST" \
              --cluster-preferred-endpoint-type hostname \
              --appendonly no \
              --protected-mode no \
              --loadmodule /opt/modules/rejson.so \
              --ignore-warnings ARM64-COW-BUG
            if [ "$$CLUSTER_LFU_SLOT_STATS" = "yes" ]; then
              set -- "$$@" \
                --maxmemory 100mb \
                --maxmemory-policy allkeys-lfu \
                --cluster-slot-stats-enabled yes
            fi
            exec docker-entrypoint.sh valkey-server "$$@"
    healthcheck:
        {
            test: ["CMD-SHELL", "valkey-cli -p $$NODE_PORT PING"],
            interval: 2s,
            timeout: 1s,
            retries: 30,
        }
    networks: [valnet]

services:
    valkey-1:
        <<: *valkey-node
        environment:
            <<: *valkey-env
            NODE_PORT: "${CLUSTER_PORT_PREFIX:-700}1"
        ports:
            - "${CLUSTER_PORT_PREFIX:-700}1:${CLUSTER_PORT_PREFIX:-700}1"
            - "1${CLUSTER_PORT_PREFIX:-700}1:1${CLUSTER_PORT_PREFIX:-700}1"
        volumes:
            - valkey-1:/data

    valkey-2:
        <<: *valkey-node
        environment:
            <<: *valkey-env
            NODE_PORT: "${CLUSTER_PORT_PREFIX:-700}2"
        ports:
            - "${CLUSTER_PORT_PREFIX:-700}2:${CLUSTER_PORT_PREFIX:-700}2"
            - "1${CLUSTER_PORT_PREFIX:-700}2:1${CLUSTER_PORT_PREFIX:-700}2"
        volumes:
            - valkey-2:/data

    valkey-3:
        <<: *valkey-node
        environment:
            <<: *valkey-env
            NODE_PORT: "${CLUSTER_PORT_PREFIX:-700}3"
        ports:
            - "${CLUSTER_PORT_PREFIX:-700}3:${CLUSTER_PORT_PREFIX:-700}3"
            - "1${CLUSTER_PORT_PREFIX:-700}3:1${CLUSTER_PORT_PREFIX:-700}3"
        volumes:
            - valkey-3:/data

    valkey-4:
        <<: *valkey-node
        environment:
            <<: *valkey-env
            NODE_PORT: "${CLUSTER_PORT_PREFIX:-700}4"
        ports:
            - "${CLUSTER_PORT_PREFIX:-700}4:${CLUSTER_PORT_PREFIX:-700}4"
            - "1${CLUSTER_PORT_PREFIX:-700}4:1${CLUSTER_PORT_PREFIX:-700}4"
        volumes:
            - valkey-4:/data

    valkey-5:
        <<: *valkey-node
        environment:
            <<: *valkey-env
            NODE_PORT: "${CLUSTER_PORT_PREFIX:-700}5"
        ports:
            - "${CLUSTER_PORT_PREFIX:-700}5:${CLUSTER_PORT_PREFIX:-700}5"
            - "1${CLUSTER_PORT_PREFIX:-700}5:1${CLUSTER_PORT_PREFIX:-700}5"
        volumes:
            - valkey-5:/data

    valkey-6:
        <<: *valkey-node
        environment:
            <<: *valkey-env
            NODE_PORT: "${CLUSTER_PORT_PREFIX:-700}6"
        ports:
            - "${CLUSTER_PORT_PREFIX:-700}6:${CLUSTER_PORT_PREFIX:-700}6"
            - "1${CLUSTER_PORT_PREFIX:-700}6:1${CLUSTER_PORT_PREFIX:-700}6"
        volumes:
            - valkey-6:/data

    cluster-init:
        image: valkey/valkey:latest
        platform: ${DOCKER_PLATFORM:-linux/arm64}
        depends_on:
            valkey-1: { condition: service_healthy }
            valkey-2: { condition: service_healthy }
            valkey-3: { condition: service_healthy }
            valkey-4: { condition: service_healthy }
            valkey-5: { condition: service_healthy }
            valkey-6: { condition: service_healthy }
        environment:
            CLUSTER_PORT_PREFIX: ${CLUSTER_PORT_PREFIX:-700}
        networks: [valnet]
        volumes:
            - ./scripts/cluster_init.sh:/usr/local/bin/cluster_init.sh:ro
        entrypoint: ["/usr/local/bin/cluster_init.sh"]
        restart: "no"

    populate:
        image: node:20
        depends_on:
            cluster-init:
                condition: service_completed_successfully
        working_dir: /app/valkey-cluster
        volumes:
            - ./populate.mjs:/app/valkey-cluster/populate.mjs:ro
            - ../common/populate-helpers.mjs:/app/common/populate-helpers.mjs:ro
        environment:
            # inside Docker network; on host use (ipconfig getifaddr en0):<port> instead
            VALKEY_START_NODE: "valkey-1:${CLUSTER_PORT_PREFIX:-700}1"
            ANNOUNCE_HOST: ${ANNOUNCE_HOST}
            POPULATE_DB_COUNT: ${POPULATE_DB_COUNT:-}
            POPULATE_BULK_KEYS: ${POPULATE_BULK_KEYS:-}
        networks: [valnet]
        command: >
            sh -c "
              npm -s install @valkey/client >/dev/null 2>&1 &&
              node populate.mjs
            "
        profiles: [populate]

networks:
    valnet:

volumes:
    valkey-1:
    valkey-2:
    valkey-3:
    valkey-4:
    valkey-5:
    valkey-6:
